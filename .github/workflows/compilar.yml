name: Compilar APK de Android

on:
  push:
    branches: [ "main" ] # Cambia "main" por el nombre de tu rama si es diferente
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java de Android (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Compilar APK (Debug)
      run: gradle assembleDebug
      working-directory: mobile # 👈 Esto le dice que entre a tu carpeta mobile
