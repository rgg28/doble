name: Build WoW Dual Ecosystem (PC and Mobile)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ecosystem:
    runs-on: windows-latest

    steps:
    - name: Cargar codigo del repositorio
      uses: actions/checkout@v4

    # --- 1. COMPILAR HERRAMIENTA DE PC (.EXE) ---
    - name: Configurar entorno .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x

    - name: Restaurar dependencias de la solucion
      run: dotnet restore WoWStreamServer.sln

    - name: Compilar ejecutable de Windows
      run: |
        dotnet publish src/WoWDualStream.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -o ./publish-pc

    # --- 2. COMPILAR APP DE CONTROLES E INSTANCIA (.APK) ---
    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Aceptar Licencias Nativas de Android
      run: |
        & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" --licenses
      shell: powershell
      env:
        INPUT_AUTO_ACCEPT_LICENSES: true

    # CORRECCIÓN DE MANIFIESTO DISPARADA DIRECTO EN LA MÁQUINA DE GITHUB
    - name: Forzar Escritura Limpia de AndroidManifest.xml
      run: |
        $manifestDir = "mobile/src/main"
        if (-not (Test-Path $manifestDir)) { New-Item -ItemType Directory -Force -Path $manifestDir }
        
        $xmlContent = @"
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application android:allowBackup="true" android:label="WoW Remote" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <activity android:name="com.wowmobile.client.MainActivity" android:exported="true" android:screenOrientation="landscape" android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        "@
        
        Set-Content -Path "$manifestDir/AndroidManifest.xml" -Value $xmlContent -Encoding Utf8
      shell: powershell

    - name: Generar Wrapper de Gradle
      run: |
        cd mobile
        gradle wrapper --gradle-version 8.2
      shell: powershell

    - name: Compilar APK Móvil con tus Controles
      run: |
        cd mobile
        ./gradlew assembleRelease
      shell: cmd

    # --- 3. SUBIR LOS DOS ARCHIVOS TERMINADOS ---
    - name: Subir Herramientas Listas
      uses: actions/upload-artifact@v4
      with:
        name: WoWDualStream-Package
        path: |
          ./publish-pc/
          ./mobile/app/build/outputs/apk/release/*.apk
