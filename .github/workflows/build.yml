name: Build and Auto-Sign WoW Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-auto-sign:
    runs-on: windows-latest

    steps:
    - name: Cargar codigo del repositorio
      uses: actions/checkout@v4

    # --- 1. CONFIGURAR ENTORNO DE ANDROID/JAVA ---
    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Aceptar Licencias Nativas de Android
      run: |
        & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" --licenses
      shell: powershell

    # --- 2. VALIDAR ESTRUCTURA NATIVA AUTOMÁTICAMENTE ---
    - name: Asegurar estructura e instalar manifiesto temporal
      run: |
        # Definir la ruta correcta según el package com.wowmobile.client
        $targetDir = "mobile\app\src\main\java\com\wowmobile\client"
        if (!(Test-Path $targetDir)) { New-Item -ItemType Directory -Force -Path $targetDir }
        
        # Si moviste el archivo a la raíz de java, reubicarlo en su package
        if (Test-Path "mobile\app\src\main\java\MainActivity.java") {
            Move-Item "mobile\app\src\main\java\MainActivity.java" "$targetDir\MainActivity.java" -Force
        }

        # Generar carpetas esenciales si no existen para evitar que Gradle falle
        if (!(Test-Path "mobile\app\src\main\res\values")) { New-Item -ItemType Directory -Force -Path "mobile\app\src\main\res\values" }
        
        # Generar un AndroidManifest.xml básico si no existe
        $manifestPath = "mobile\app\src\main\AndroidManifest.xml"
        if (!(Test-Path $manifestPath)) {
            $manifestContent = @"
            <?xml version="1.0" encoding="utf-8"?>
            <manifest xmlns:android="http://android.com" package="com.wowmobile.client">
                <uses-permission android:name="android.permission.INTERNET" />
                <application android:label="WoW Dual Stream" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                    <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </intent-filter>
                    </activity>
                </application>
            </manifest>
            "@
            Set-Content -Path $manifestPath -Value $manifestContent
        }
      shell: powershell

    # --- 3. GENERAR FIRMA AUTOMÁTICA (KEYSTORE TEMPORAL) ---
    - name: Generar Keystore Temporal
      run: |
        keytool -genkeypair -v -keystore auto_generated.keystore -alias auto_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass "TemporalPass123" -keypass "TemporalPass123" -dname "CN=WoWDualStream, OU=Development, O=AutoGenerated, L=Unknown, S=Unknown, C=US"
      shell: cmd

    # --- 4. COMPILAR APK MÓVIL ---
    - name: Generar Wrapper de Gradle
      run: |
        cd mobile
        gradle wrapper --gradle-version 8.2
      shell: powershell

    - name: Compilar APK Móvil (Modo Release)
      run: |
        cd mobile
        ./gradlew assembleRelease
      shell: cmd

    # --- 5. BUSCAR Y FIRMAR EL APK COMPILADO CON APKSIGNER ---
    - name: Firmar APK con Herramientas del SDK
      run: |
        $apkFile = Get-ChildItem -Path .\mobile\ -Filter "*.apk" -Recurse | Select-Object -First 1
        if ($null -eq $apkFile) {
            Write-Error "No se encontro ningun archivo APK compilado en el directorio mobile."
            exit 1
        }
        Move-Item -Path $apkFile.FullName -Destination .\app-release.apk
        $apkSigner = Get-ChildItem -Path "$env:ANDROID_HOME\build-tools" -Filter "apksigner.bat" -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        & $apkSigner.FullName sign --ks auto_generated.keystore --ks-key-alias auto_alias --ks-pass pass:TemporalPass123 --key-pass pass:TemporalPass123 --out .\app-release-signed.apk .\app-release.apk
      shell: powershell

    # --- 6. SUBIR EL APK LISTO Y FIRMADO ---
    - name: Subir APK Listo y Firmado
      uses: actions/upload-artifact@v4
      with:
        name: WoWDualStream-Mobile-Signed-APK
        path: app-release-signed.apk
