name: Build and Auto-Sign WoW Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-auto-sign:
    runs-on: windows-latest

    steps:
    - name: Cargar codigo del repositorio
      uses: actions/checkout@v4

    # --- 1. CONFIGURAR ENTORNO DE ANDROID/JAVA ---
    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Aceptar Licencias Nativas de Android
      run: |
        & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" --licenses
      shell: powershell

    # --- 2. GENERAR FIRMA AUTOMÁTICA (KEYSTORE TEMPORAL) ---
    - name: Generar Keystore Temporal
      run: |
        keytool -genkeypair -v -keystore auto_generated.keystore -alias auto_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass "TemporalPass123" -keypass "TemporalPass123" -dname "CN=WoWDualStream, OU=Development, O=AutoGenerated, L=Unknown, S=Unknown, C=US"
      shell: cmd

    # --- 3. COMPILAR APK MÓVIL ---
    - name: Generar Wrapper de Gradle
      run: |
        cd mobile
        gradle wrapper --gradle-version 8.2
      shell: powershell

    - name: Compilar APK Móvil (Modo Release)
      run: |
        cd mobile
        ./gradlew assembleRelease
      shell: cmd

    # --- 4. APLICAR FIRMA AUTOMÁTICA AL APK ---
    - name: Firmar APK con Keystore Temporal
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: mobile/app/build/outputs/apk/release
        signingKeyBase64: "" # No es necesario pasarlo en base64 si mapeamos el archivo localmente
        alias: auto_alias
        singleFile: true
        keyStorePassword: TemporalPass123
        keyPassword: TemporalPass123
      env:
        # Forzamos a la acción a leer el archivo de la firma generado en el paso 2
        ANDROID_KEYSTORE_PATH: ../../auto_generated.keystore

    # --- 5. SUBIR EL APK LISTO Y FIRMADO ---
    - name: Subir APK Listo y Firmado
      uses: actions/upload-artifact@v4
      with:
        name: WoWDualStream-Mobile-AutoSigned-APK
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
