name: Build and Auto-Sign WoW Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-auto-sign:
    runs-on: windows-latest

    steps:
    - name: Cargar codigo del repositorio
      uses: actions/checkout@v4

    # --- 1. CONFIGURAR ENTORNO DE ANDROID/JAVA ---
    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Aceptar Licencias Nativas de Android
      run: |
        & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" --licenses
      shell: powershell

    # --- 2. GENERAR FIRMA AUTOMÁTICA (KEYSTORE TEMPORAL) ---
    - name: Generar Keystore Temporal
      run: |
        keytool -genkeypair -v -keystore auto_generated.keystore -alias auto_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass "TemporalPass123" -keypass "TemporalPass123" -dname "CN=WoWDualStream, OU=Development, O=AutoGenerated, L=Unknown, S=Unknown, C=US"
      shell: cmd

    # --- 3. COMPILAR APK MÓVIL ---
    - name: Generar Wrapper de Gradle
      run: |
        cd mobile
        gradle wrapper --gradle-version 8.2
      shell: powershell

    - name: Compilar APK Móvil (Modo Release)
      run: |
        cd mobile
        ./gradlew assembleRelease
      shell: cmd

    # --- 4. BUSCAR Y FIRMAR EL APK COMPILADO CON APKSIGNER ---
    - name: Firmar APK con Herramientas del SDK
      run: |
        # Buscar el archivo APK generado de forma recursiva en la carpeta mobile
        $apkFile = Get-ChildItem -Path .\mobile\ -Filter "*.apk" -Recurse | Select-Object -First 1
        
        if ($null -eq $apkFile) {
            Write-Error "No se encontro ningun archivo APK compilado en el directorio mobile."
            exit 1
        }
        
        Write-Host "APK encontrado en: $($apkFile.FullName)"
        
        # Mover el APK a la raíz para facilitar su manejo
        Move-Item -Path $apkFile.FullName -Destination .\app-release.apk
        
        # Buscar el apksigner.bat más reciente en el SDK de Android
        $apkSigner = Get-ChildItem -Path "$env:ANDROID_HOME\build-tools" -Filter "apksigner.bat" -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        
        if ($null -eq $apkSigner) {
            Write-Error "No se encontro apksigner.bat en el SDK de Android."
            exit 1
        }
        
        Write-Host "Usando apksigner en: $($apkSigner.FullName)"
        
        # Ejecutar la firma del APK
        & $apkSigner.FullName sign --ks auto_generated.keystore --ks-key-alias auto_alias --ks-pass pass:TemporalPass123 --key-pass pass:TemporalPass123 --out .\app-release-signed.apk .\app-release.apk
        
        Write-Host "¡APK firmado exitosamente!"
      shell: powershell

    # --- 5. SUBIR EL APK LISTO Y FIRMADO ---
    - name: Subir APK Listo y Firmado
      uses: actions/upload-artifact@v4
      with:
        name: WoWDualStream-Mobile-AutoSigned-APK
        path: app-release-signed.apk
