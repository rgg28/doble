name: Build and Auto-Sign WoW Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-auto-sign:
    runs-on: windows-latest

    steps:
    - name: Cargar codigo del repositorio
      uses: actions/checkout@v4

    # --- 1. CONFIGURAR ENTORNO DE ANDROID/JAVA ---
    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Aceptar Licencias Nativas de Android
      run: |
        echo y | "%ANDROID_HOME%\cmdline-tools\latest\bin\sdkmanager.bat" --licenses
      shell: cmd

    # --- 2. FORZAR ESTRUCTURA CORRECTA (CMD SEGURO) ---
    - name: Validar carpetas y manifiesto de red
      run: |
        if not exist "mobile\app\src\main\java\com\wowmobile\client" mkdir "mobile\app\src\main\java\com\wowmobile\client"
        if not exist "mobile\app\src\main\res\values" mkdir "mobile\app\src\main\res\values"
        
        :: Mover el MainActivity a su paquete correspondiente si quedó suelto en java/
        if exist "mobile\app\src\main\java\MainActivity.java" move /Y "mobile\app\src\main\java\MainActivity.java" "mobile\app\src\main\java\com\wowmobile\client\MainActivity.java"
        
        :: Crear un AndroidManifest.xml limpio que garantice los permisos de internet (Sockets)
        echo ^<?xml version="1.0" encoding="utf-8"?^>^<manifest xmlns:android="http://android.com" package="com.wowmobile.client"^>^<uses-permission android:name="android.permission.INTERNET" /^>^<application android:label="WoW Dual Stream" android:theme="@android:style/Theme.NoTitleBar.Fullscreen"^>^<activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape"^>^<intent-filter^>^<action android:name="android.intent.action.MAIN" /^>^<category android:name="android.intent.category.LAUNCHER" /^>^</intent-filter^>^</activity^>^</application^>^</manifest^> > mobile\app\src\main\AndroidManifest.xml
      shell: cmd

    # --- 3. GENERAR FIRMA AUTOMÁTICA ---
    - name: Generar Keystore Temporal
      run: |
        keytool -genkeypair -v -keystore auto_generated.keystore -alias auto_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass "TemporalPass123" -keypass "TemporalPass123" -dname "CN=WoWDualStream, OU=Development, O=AutoGenerated, L=Unknown, S=Unknown, C=US"
      shell: cmd

    # --- 4. COMPILAR APK MÓVIL (LIMPIANDO CACHÉ) ---
    - name: Generar Wrapper de Gradle
      run: |
        cd mobile
        gradle wrapper --gradle-version 8.2
      shell: cmd

    - name: Compilar APK Móvil (Modo Release)
      run: |
        cd mobile
        ./gradlew assembleRelease --no-build-cache --rerun-tasks
      shell: cmd

    # --- 5. FIRMAR CON APKSIGNER DEL SDK ---
    - name: Firmar APK con Herramientas del SDK
      run: |
        powershell -Command "$apkFile = Get-ChildItem -Path .\mobile\ -Filter '*.apk' -Recurse | Select-Object -First 1; Move-Item -Path $apkFile.FullName -Destination .\app-release.apk"
        powershell -Command "$apkSigner = Get-ChildItem -Path \"$env:ANDROID_HOME\build-tools\" -Filter 'apksigner.bat' -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1; & $apkSigner.FullName sign --ks auto_generated.keystore --ks-key-alias auto_alias --ks-pass pass:TemporalPass123 --key-pass pass:TemporalPass123 --out .\app-release-signed.apk .\app-release.apk"
      shell: cmd

    # --- 6. SUBIR EL APK INTEGRADO ---
    - name: Subir APK Listo y Firmado
      uses: actions/upload-artifact@v4
      with:
        name: WoWDualStream-Mobile-Signed-APK
        path: app-release-signed.apk
